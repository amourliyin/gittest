<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect x="0" y="0" width="600" height="400" fill="white" />
  <g stroke="black" stroke-width="3" fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Base block (full depth) -->
    <rect x="120" y="200" width="360" height="120" />
    <!-- Upper block (reduced depth, centered) -->
    <rect x="210" y="80" width="180" height="120" />
  </g>
  <g stroke="black" stroke-width="2" fill="none" stroke-linecap="square" stroke-dasharray="8 6">
    <!-- Hidden edges of the reduced-depth connector inside the base -->
    <line x1="210" y1="200" x2="210" y2="320" />
    <line x1="390" y1="200" x2="390" y2="320" />
    <!-- Centerline -->
    <line x1="300" y1="60" x2="300" y2="340" />
  </g>
</svg>
